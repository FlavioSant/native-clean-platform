name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# On a PR, a new push cancels the previous run. On main, never: every commit
# needs its own verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Actions are pinned by commit SHA: a tag is a movable pointer and
      # Actions has no lockfile, so the tag is the only reference there is.
      # Dependabot keeps these current — see .github/dependabot.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before setup-node: the `cache: pnpm` below needs pnpm on PATH.
      # The version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # A lockfile out of sync with package.json fails right here.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:ci
